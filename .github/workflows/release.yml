name: Release APK

# Push a tag like v1.2.0 to build, sign and publish an APK that the app's
# "App updates" screen can find. Required repository secrets:
#   KEYSTORE_BASE64   base64 of your release keystore (keep this key forever:
#                     phones only accept updates signed with the same key)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check signing secrets are present
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
          AL: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS PW AL KP; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is empty or missing"; exit 1; fi
          done
      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Check keystore opens with the password and alias
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
          AL: ${{ secrets.KEY_ALIAS }}
        run: keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "$AL" > /dev/null
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}" \
            -PupdateRepo="${{ github.repository }}"
      - name: Name APK and write SHA-256
        run: |
          cp app/build/outputs/apk/release/app-release.apk PocketGuardian-${GITHUB_REF_NAME#v}.apk
          sha256sum PocketGuardian-${GITHUB_REF_NAME#v}.apk | cut -d' ' -f1 > PocketGuardian-${GITHUB_REF_NAME#v}.apk.sha256
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" PocketGuardian-*.apk PocketGuardian-*.apk.sha256 --notes "Pocket Guardian ${GITHUB_REF_NAME#v}" --title "$GITHUB_REF_NAME"
